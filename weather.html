<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link rel="stylesheet" href="weather.css">
</head>

<body>

    <div class="container">

        <h1>Weather App</h1>

        <p class="subtitle">
            Check the current weather of any city
        </p>

        <div class="search-box">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name"
            >

            <button onclick="getWeather()">
                Search
            </button>

        </div>

        <p id="error"></p>

        <div class="weather-card" id="weatherCard">

            <h2 id="city">City</h2>

            <div class="temperature">
                <span id="temperature">--</span> °C
            </div>

            <p id="description">
                Weather condition
            </p>

            <div class="details">

                <div>
                    <h3>Feels Like</h3>
                    <p id="feelsLike">-- °C</p>
                </div>

                <div>
                    <h3>Humidity</h3>
                    <p id="humidity">-- %</p>
                </div>

                <div>
                    <h3>Wind Speed</h3>
                    <p id="wind">-- m/s</p>
                </div>

                <div>
                    <h3>Pressure</h3>
                    <p id="pressure">-- hPa</p>
                </div>

            </div>

        </div>

    </div>

    <script src="weather.js"></script>

</body>

</html>
